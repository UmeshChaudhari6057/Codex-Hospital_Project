name: Build

on:
  push:
    branches:
      - main
      - feature/day-1
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn clean install -DskipTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hospital-frontend/package-lock.json
      - run: npm install
      - run: npm run build
